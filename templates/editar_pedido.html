<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Pedido</title>
    <style>
        body { font-family: Arial; margin: 20px; background-color: #f9f9f9; }
        input[type=number] { padding:5px; width:60px; }
        input[type=submit], .btn { padding:5px 10px; cursor:pointer; border-radius:5px; }
        .btn { text-decoration:none; background-color:#007bff; color:white; }
        .btn:hover { background-color:#0056b3; }
    </style>
</head>
<body>
    <h1>Editar Pedido</h1>

    <form method="post">
        Quantidade: <input type="number" name="quantidade" value="{{ pedido['quantidade'] }}" min="1">
        <input type="submit" value="Atualizar">
    </form>

    <br>
    <a class="btn" href="{{ url_for('ver_comanda', comanda_id=pedido['comanda_id']) }}">Voltar</a>
</body>
</html>
